name: Daily data pipeline

on:
  schedule:
    - cron: '0 12 * * *'   # noon UTC (7 AM Central) every day
  workflow_dispatch:         # also runnable manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Bathymetry survey pipeline ────────────────────────────────────────────
      - name: Check for new survey IDs
        run: python update_bathym/check_for_surveys.py

      - name: Download new surveys
        run: python update_bathym/read_in_surveys.py

      - name: Convert datums
        run: python update_bathym/process_surveys.py

      - name: Compute bathymetry stats
        run: python update_bathym/compute_bathym_stats.py

      - name: Generate depth polygons
        run: python update_bathym/make_depth_polygons.py

      # ── Notice pipeline ───────────────────────────────────────────────────────
      - name: Fetch new USCG notices
        run: python notice_to_mariners/fetch_notices.py

      # ── River stage ───────────────────────────────────────────────────────────
      - name: Fetch river stage readings
        run: python fetch_stage.py

      # ── Barge rates / corn / soy prices / Dec-corn & Nov-soy futures ─────────
      - name: Fetch barge rate and price data
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: python fetch_market_data.py

      # ── Barge demand indicator: WASDE production estimate + NASS history ────
      - name: Fetch latest WASDE production estimate
        run: python fetch_wasde.py

      - name: Fetch historical grain production (NASS QuickStats)
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python fetch_grain_production.py

      # ── Detect whether anything actually changed ──────────────────────────────
      - name: Stage pipeline outputs
        id: stage
        run: |
          git add \
            bathym_fixed.csv \
            update_bathym/data/DepthPolygons/ \
            update_bathym/data/NAVD88Files/ \
            update_bathym/lm_ids_done.csv \
            update_bathym/um_ids_done.csv \
            notices_*.xlsx \
            notice_to_mariners/last_run_date.csv \
            river_stage_history.csv \
            barge_rates_history.csv \
            corn_price_history.csv \
            soy_price_history.csv \
            futures_dec_nov_history.csv \
            wasde_production_estimate.csv \
            grain_production_history.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "new_data=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed — no commit needed."
          else
            echo "new_data=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      # ── Commit and push only when there is new data ───────────────────────────
      - name: Commit and push
        if: steps.stage.outputs.new_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily pipeline $(date -u +%Y-%m-%d): new data pending review"
          git push

      # ── Open a GitHub Issue so Molly gets an email notification ──────────────
      - name: Open review issue
        if: steps.stage.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "New data pending review — $(date -u +%Y-%m-%d)" \
            --assignee mollya610 \
            --body "@mollya610 the daily pipeline found new surveys or notices.

          **Bathymetry surveys** — pull latest, then run \`python update_bathym/review_surveys.py\` locally and open http://127.0.0.1:8060 to review pending surveys (rows where \`confirmed=no\` in \`bathym_fixed.csv\`). Approving writes \`confirmed\`/\`at_risk\` back to the CSV. Push when done — those surveys will appear on the live site after Render redeploys and the next daily run generates their depth polygons.

          **Notices** — open \`notices_YYYY.xlsx\` for the relevant year. New rows have \`confirmed\` blank — fill in any missing fields and set \`confirmed=Y\` to show the notice on the map, or leave blank/set to N to hide it. Push the updated file when done.

          The live site only displays rows where \`confirmed=yes\` (bathymetry) or \`confirmed=Y\` (notices)."
